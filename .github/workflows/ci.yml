name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    name: Skill quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enforce the CI trigger and action-pin policy
        run: scripts/check-ci-policy.sh

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Install pinned JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Enforce the Folderbase-only public surface
        run: scripts/check-public-eclipse.sh

      - name: Check repository acceptance contract
        run: tests/acceptance.sh

      - name: Validate the Agent Skills specification
        run: node_modules/.bin/skills-ref validate skills/work-with-folderbase

      - name: Test discovery and agent installations
        run: tests/distribution.sh

      - name: Test the immutable Folderbase Core contract
        run: tests/core-contract.sh
